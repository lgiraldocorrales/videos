<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Clicks 2025 – Análisis SEO</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" href="https://www.crystal.com.co/static/store/images/Logos/crystal-sas.png">

		<style>
		:root {
			--bg-main: #1f2227;
			--bg-card: #262a30;
			--text-primary: #f1f1f1;
			--text-secondary: #b5b8bd;
			--accent: #e56b86;
			--grid: #3a3f46;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
			background-color: var(--bg-main);
			color: var(--text-primary);
			line-height: 1.6;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 48px 24px 64px;
		}

		header {
			margin-bottom: 24px;
		}

		header h1 {
			font-size: 2.6rem;
			font-weight: 700;
		}

		header h1 span {
			color: var(--accent);
		}

		header p {
			margin-top: 12px;
			max-width: 720px;
			color: var(--text-secondary);
		}

		/* === BOTONES DE MARCA === */

		.brand-selector {
			display: flex;
			gap: 12px;
			margin-top: 24px;
			flex-wrap: wrap;
		}

		.brand-btn {
			background: transparent;
			color: var(--text-secondary);
			border: 1px solid var(--grid);
			padding: 10px 18px;
			border-radius: 20px;
			cursor: pointer;
			font-size: 0.9rem;
			transition: all 0.2s ease;
		}

		.brand-btn:hover {
			color: var(--text-primary);
			border-color: var(--accent);
		}

		.brand-btn.active {
			background-color: var(--accent);
			color: #fff;
			border-color: var(--accent);
			font-weight: bold;
		}

		/* === CARDS === */

		.card {
			background-color: var(--bg-card);
			border-radius: 12px;
			padding: 24px;
			margin-bottom: 32px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.25);
		}

		.card h2 {
			font-size: 1.4rem;
			margin-bottom: 12px;
		}

		/* === FLOURISH === */

		.flourish-wrapper {
			position: relative;
			width: 100%;
			padding-top: 56.25%;
		}

		.flourish-wrapper iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 8px;
		}

		/* === VISIBILIDAD POR MARCA === */

		.brand-content {
			display: none;
		}

		.brand-content.active {
			display: block;
		}

		.flourish-credit {
			display: none!important;
		}

		.nav-style-tractor nav{
			background-color: #c6c6c6!important;
		}

		.card {
			height: 100vh;
		}
		
		.card-info {
			text-align: center;
			margin-bottom: 15px;
		}
		</style>
	</head>

	<body>
		<div class="container">
			<header>
				<h1>Clicks e Impresiones <span>2025</span></h1>
				<p>
					Evolución mensual de clics e impresiones orgánicas por marca. <br>
					Selecciona una marca para visualizar su desempeño SEO.
				</p>

				<div class="brand-selector">
					<button class="brand-btn active" data-brand="marca-gef">Gef</button>
					<button class="brand-btn" data-brand="marca-pbc">Punto Blanco</button>
					<button class="brand-btn" data-brand="marca-bbf">Baby Fresh</button>
					<button class="brand-btn" data-brand="marca-glx">Galax</button>
				</div>
			</header>

			<!-- === Gef === -->
			<section class="brand-content active" id="marca-gef">
				<div class="card">
					<div class="card-info">
						<h2>Visualización</h2>
						<img src="https://www.gef.co/cdn/shop/files/logo_header.svg?v=1750104582&amp;width=160" alt="Gef Colombia" width="80" height="69">
					</div>
					<div class="flourish-wrapper">
						<!-- IFRAME FLOURISH Gef -->
						<div class="flourish-embed" data-src="story/3543182">
							<script src="https://public.flourish.studio/resources/embed.js"></script>
							<noscript><img src="https://public.flourish.studio/story/3543182/thumbnail" width="100%" alt="visualizacion" /></noscript>
						</div>
					</div>
				</div>
			</section>

			<!-- === Punto Blanco === -->
			<section class="brand-content" id="marca-pbc">
				<div class="card">
					<div class="card-info">
						<h2>Visualización</h2>
						<img src="https://www.puntoblanco.co/cdn/shop/files/Logo_home_desktop.svg?v=1720826284&amp;width=260" alt="Punto Blanco Colombia" width="130" height="22">
					</div>
					<div class="flourish-wrapper">
						<!-- IFRAME FLOURISH Punto Blanco -->
						<div class="flourish-embed" data-src="story/3544419">
							<script src="https://public.flourish.studio/resources/embed.js"></script>
							<noscript><img src="https://public.flourish.studio/story/3544419/thumbnail" width="100%" alt="visualizacion" /></noscript>
						</div>
					</div>
				</div>
			</section>

			<!-- === Baby Fresh === -->
			<section class="brand-content" id="marca-bbf">
				<div class="card">
					<div class="card-info">
						<h2>Visualización</h2>
						<img src="https://www.babyfresh.co/cdn/shop/files/Logo_Azul_84cf2169-d8f2-4353-98d0-ca2489de54c0.png?v=1721848726&amp;width=240" alt="Baby Fresh" width="120" height="17">
					</div>
					<div class="flourish-wrapper">
						<!-- IFRAME FLOURISH Baby Fresh -->
						<div class="flourish-embed" data-src="story/3544461">
							<script src="https://public.flourish.studio/resources/embed.js"></script>
							<noscript><img src="https://public.flourish.studio/story/3544461/thumbnail" width="100%" alt="visualizacion" /></noscript>
						</div>
					</div>
				</div>
			</section>

			<!-- === Galax === -->
			<section class="brand-content" id="marca-glx">
				<div class="card">
					<div class="card-info">
						<h2>Visualización</h2>
						<img src="https://www.galax.co/cdn/shop/files/LOGO-GALAX-NARANJA.png?v=1698888666&amp;width=80" width="80" height="34" alt="Medias Galax">
					</div>
					<div class="flourish-wrapper">
						<!-- IFRAME FLOURISH Galax -->
						<div class="flourish-embed" data-src="story/3544492">
							<script src="https://public.flourish.studio/resources/embed.js"></script>
							<noscript><img src="https://public.flourish.studio/story/3544492/thumbnail" width="100%" alt="visualizacion" /></noscript>
						</div>
					</div>
				</div>
			</section>
		</div>

		<script>
		const buttons = document.querySelectorAll('.brand-btn');
		const contents = document.querySelectorAll('.brand-content');

		buttons.forEach(btn => {
			btn.addEventListener('click', () => {
				const brand = btn.dataset.brand;

				buttons.forEach(b => b.classList.remove('active'));
				btn.classList.add('active');

				contents.forEach(c => {
					c.classList.remove('active');
					if (c.id === brand) c.classList.add('active');
				});
			});
		});
		</script>

	</body>

</html>
